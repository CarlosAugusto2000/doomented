<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="naoki">
        <h3>Páginas amigas de Eidolon</h3>
        <ul>
            <li>
                <a href="https://naoki321.neocities.org" target="_blank" rel="noopener noreferrer">Naoki</a>
            </li>
        </ul>
    </div>
    <section class="hero-section">
    <h1 id="title">Greetings Mortal!</h1>
    </section>
    <section class="comments-section">
        <h2>Deixe seu comentário,servo de Eidolon!</h2>
        <form id="comment-form">
            <div class="input-group">
                <label for="username">Nome de Usuário:</label>
                <input type="text" id="username" placeholder="Digite o seu nome" required>
            </div>
          <div class="input-group">
            <label for="message">Mensagem:</label>
            <textarea id="message" rows="4" placeholder="Escreva sua mensagem aqui." required></textarea>
          </div>
          <button type="submit">Enviar</button>
        </form>
    </section>
    <script src="scripts.js"></script>
</body>
</html>
