<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments - Doomented</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=MedievalSharp&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body class="comments-page">

    <div class="comment-form-container">
        <h1 class="form-title">Send your message</h1>
        <form id="comment-form">
            <div class="form-group">
                <label for="nickname" class="form-label">Nickname</label>
                <input type="text" id="nickname" required placeholder="Your nickname">
            </div>
            <div class="form-group">
                <label for="comment" class="form-label">Comment</label>
                <textarea id="comment" required placeholder="Write your comment..."></textarea>
            </div>
            <button type="submit" class="submit-btn">comment</button>
        </form>
    </div>

    <div class="comments-section">
        <h2 class="comments-title">Comments</h2>
        <div id="comments-list"></div>
    </div>

<script src="./scripts.js"></script>
</body>
</html>
