<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - Leave a Message</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="form-page-body">

    <main class="form-card">
        <h1>Leave your message</h1>
        
        <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Mensagem enviada!');">
            <div class="form-group">
                <label for="nome">Nome / Nickname:</label>
                <input type="text" id="nome" name="nome" class="form-control" required placeholder="Seu nome...">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" class="form-control" required placeholder="Escreva aqui sua mensagem..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar</button>
        </form>
    </main>

</body>
</html>
